[project]
name = "linear-regression-model"
version = "0.1.0"
description = "Predicting the out-of-school children rate across African countries to support the mission of connecting orphaned and vulnerable children with educational opportunity."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
    "jupyter>=1.0",
    "fastapi>=0.111",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false
